name: GitlabSync

on:
  - push
  - delete

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name:  Upload JaR artifact
        uses: actions/upload-artifact@v4
        with:
              name: spring-app-jar
              path: target/*.jar
